<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стайлер Yamaguchhi</title>
  </head>
  <body>
    <main>
      <section class="slide">
        <div class="slide__card">
          <h1 class="slide__title">
            ФЕН и СТАЙЛЕР<br />
            &nbsp;в уникальном дизайне
          </h1>
        
          <p class="slide__badge">2 в 1</p>
        
          <div class="slide__visual">
            <figure class="slide__demo slide__demo--dryer">
              <figcaption class="slide__label">Фен</figcaption>
              <img
                src="/images/hairdryer-demo.png"
                alt="Использование прибора в режиме фена"
              />
            </figure>
          
            <img
              class="slide__hero"
              src="/images/styler-hero.png"
              alt="Фен и стайлер Yamaguchi, прямые и завитые волосы"
            />
          
            <figure class="slide__demo slide__demo--styler">
              <figcaption class="slide__label">Стайлер</figcaption>
              <img
                src="/images/styler-demo.png"
                alt="Использование прибора для укладки волос"
              />
            </figure>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
